<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Portal Hunter</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col items-center justify-center p-6">
    
    <div class="text-center mb-12">
        <h1 class="text-5xl font-bold text-red-500 mb-4 tracking-widest uppercase shadow-black drop-shadow-lg">Sistema Hunter</h1>
        <p class="text-xl text-gray-400">Identifique-se para entrar na mesa</p>
    </div>

    <div class="grid grid-cols-2 lg:grid-cols-4 gap-8 w-full max-w-5xl" id="lista-perfis"></div>

    <div id="mensagem-erro" class="mt-8 text-red-500 font-bold text-xl h-8 animate-pulse uppercase tracking-wider"></div>

    <button id="btn-emergencia" class="mt-16 text-gray-700 hover:text-gray-400 text-xs underline transition-colors">
        Forçar Desconexão de Todos (Usar se alguém bugar)
    </button>

    <script type="module" src="js/login.js"></script>
</body>
</html>
